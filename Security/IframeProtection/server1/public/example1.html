<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickjacking Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .decoy-content {
            position: relative;
            z-index: 1;
        }

        #legit-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 2;
            border: none;
            background: transparent;
        }

</head>

<body>
    <div class="decoy-content">
        <h1>Clickjacking Example</h1>
        <p>Click the button below to see a simple clickjacking demonstration.</p>
        <button id="overlay-button">Click Me!</button>
    </div>

    <iframe title="ClickjackingIFrame" src="http://localhost:5011/iframe-example1" id="legit-iframe"></iframe>
